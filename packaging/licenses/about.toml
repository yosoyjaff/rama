# cargo-about: the licences a release archive may carry, in order of
# preference when a crate offers a choice. GPL/LGPL are left out on purpose:
# the crates that offer them (self_cell, r-efi) also offer Apache-2.0 or MIT.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MIT-0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "NCSA",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
# Only what ends up in the shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
