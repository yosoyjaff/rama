name: Release

# Runs ONLY when a version tag is pushed (or by hand from the Actions tab),
# never on an ordinary push, so day-to-day work costs no Actions minutes.
#
#   1. bump `version` in Cargo.toml, add its `## [0.2.0]` section to
#      CHANGELOG.md, and commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The release it publishes carries every platform's archive and the
# `latest.json` the app reads to offer the update (src/update/github.rs).
# Its notes are that version's CHANGELOG.md section.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading v)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: rama
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The app compares this build's own version (Cargo.toml) with the
      # release's: a tag that disagrees would publish a build that keeps
      # offering itself the same update.
      - name: Check the tag matches Cargo.toml
        run: |
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$crate" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.version.outputs.version }}, Cargo.toml says $crate"
            exit 1
          fi

      # Created once here so the parallel builds don't race to create it, and
      # as a draft so nobody (the updater included: /releases/latest skips
      # drafts) sees a release with half its assets. Skipped when the tag
      # already has one, e.g. a re-run.
      - name: Create the draft release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; skipping"
          else
            # --target only matters from the Actions tab, where the tag may
            # not exist yet: it is created on the commit being built.
            gh release create "v$VERSION" --draft --title "v$VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi

      # Every archive ships its dependencies' licences (packaging/package.sh).
      # Generated once here, for every target at once, rather than in each
      # build: it takes minutes, and macOS minutes cost ten times as much.
      # Pinned and --locked so a fresh release of the tool can't break this.
      - name: Collect third-party licences
        run: |
          cargo install --locked cargo-about@0.9.2 --features cli
          cargo about generate --locked -c packaging/licenses/about.toml \
            packaging/licenses/about.hbs -o THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu: a binary runs on any
        # glibc at least as new as the one it was linked against, so this
        # sets how old a distribution the .deb, .rpm and AppImage reach.
        # Windows on Arm cross-compiles from x64; macOS Intel from Apple Silicon.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows signing, through SignPath Foundation (docs/PACKAGING.md). It
      # runs once the repository variable SIGNPATH_ORGANIZATION_ID exists;
      # from then on a missing token or a rejected request fails the job
      # instead of publishing an unsigned build. It signs before Package so
      # the archive's checksum, and the manifest, cover the signed binary.
      - name: Upload the unsigned executable
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY }}.exe
          if-no-files-found: error

      - name: Sign the executable
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The signed copy replaces the build output, and is checked first: a
      # valid Authenticode signature with a timestamp, so it outlives the
      # certificate's own expiry.
      - name: Verify the signature
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $exe = "signed/$env:BINARY.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') {
            throw "Signature on $exe is $($signature.Status): $($signature.StatusMessage)"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Signature on $exe has no timestamp"
          }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
          Copy-Item -Force $exe "target/${{ matrix.target }}/release/$env:BINARY.exe"

      # Archive rather than a bare binary: a single file per target keeps the
      # manifest's checksum meaningful, and leaves room for the assets a
      # bundle grows later.
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses

      # Installer tools, pinned and --locked like cargo-about above. The cargo
      # tools are built from source: their prebuilt binaries want a newer
      # glibc than this runner has.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-deb@3.7.0 cargo-generate-rpm@0.21.0
          arch="$(uname -m)"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${arch}.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
          # dpkg-shlibdeps (cargo-deb's $auto dependencies) is in dpkg-dev;
          # appimagetool refuses to run without desktop-file-validate.
          sudo apt-get install -y --no-install-recommends dpkg-dev desktop-file-utils

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          # appimagetool is itself an AppImage, and runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Uploads every archive, installer and latest.json to the draft, then
  # publishes it.
  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Only the packaged archives and installers: not the licences (already
      # inside each) nor Windows' unsigned executable.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # The file `base_update` reads. Its URLs must point at the assets this
      # same release publishes, so it is built after every artifact exists.
      - name: Build the release manifest
        env:
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.prepare.outputs.version }}
          NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}
        run: bash packaging/manifest.sh dist > dist/latest.json

      - name: Publish
        run: |
          gh release upload "v$VERSION" dist/* --clobber
          gh release edit "v$VERSION" --draft=false --latest
