name: Bug report
description: Something in Rama doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please search the
        [existing issues](https://github.com/yosoyjaff/rama/issues) first.
        For security problems, see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rama version
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: Drag images here. If Rama crashed, run it from a terminal and paste the output.
